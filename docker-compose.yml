services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fundops
      POSTGRES_PASSWORD: fundops
      POSTGRES_DB: fundops
    ports:
      - "5432:5432"
    volumes:
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
